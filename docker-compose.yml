services:
  postgres:
    image: postgres:17
    container_name: bbl-bookmarks-postgres
    environment:
      POSTGRES_USER: bookmarks
      POSTGRES_PASSWORD: bookmarks
      POSTGRES_DB: bookmarks
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the separate test database used by the e2e suite.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookmarks -d bookmarks"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Opt-in: `docker compose --profile app up --build`. Local development still uses
  # `docker compose up -d postgres` plus `npm run start:dev` / `npm run dev` (README).
  api:
    profiles: ["app"]
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://bookmarks:bookmarks@postgres:5432/bookmarks?schema=public
      PORT: 4000
      AUTH_ISSUER: https://dev-yg.us.auth0.com/
      AUTH_AUDIENCE: https://bbl-candidate-test-api
      AUTH_JWKS_URI: https://dev-yg.us.auth0.com/.well-known/jwks.json
      AUTH_USERINFO_URI: https://dev-yg.us.auth0.com/userinfo
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: ["app"]
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
