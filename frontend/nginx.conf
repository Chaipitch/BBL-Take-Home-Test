server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;

  # Single-page app: unknown paths (/collections/:id, /shared, /callback) must return index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
